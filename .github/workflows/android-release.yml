name: Android Release

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/android-release.yml"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' client/pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | xargs)
          VERSION_CODE=${{ github.run_number }}
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}+${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "full=${VERSION_NAME}+${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Restore keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > client/android/app/keystore.jks

      - name: Write key.properties
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat > client/android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=keystore.jks
          EOF

      - name: Write .env from secret
        run: |
          echo "${{ secrets.FLUTTER_ENV }}" > client/.env

      - name: Install Flutter dependencies
        working-directory: client
        run: flutter pub get

      - name: Run Flutter unit tests
        working-directory: client
        run: flutter test

      - name: Build release APK
        working-directory: client
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}

      - name: Rename APK with version
        run: |
          mv client/build/app/outputs/flutter-apk/app-release.apk \
             client/build/app/outputs/flutter-apk/JobCruiser-${{ steps.version.outputs.full }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Job Cruiser ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})"
          body: |
            ## Job Cruiser ${{ steps.version.outputs.name }}

            **Build:** `${{ steps.version.outputs.code }}`
            **Commit:** `${{ github.sha }}`

            ### Install
            Download `JobCruiser-${{ steps.version.outputs.full }}.apk` below and open it on your Android device.
            Enable *Install from unknown sources* for your browser or file manager if prompted.

            ### What changed
            ${{ github.event.head_commit.message }}
          files: |
            client/build/app/outputs/flutter-apk/JobCruiser-${{ steps.version.outputs.full }}.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f client/android/app/keystore.jks client/android/key.properties
