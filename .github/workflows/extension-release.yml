name: Extension Release & Publish

on:
  push:
    branches:
      - main
    paths:
      - 'extension/**'
      - '.github/workflows/extension-release.yml'
  workflow_dispatch:

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: extension
        run: npm run typecheck

      - name: Run unit tests
        working-directory: extension
        run: npm test

      - name: Resolve extension version
        id: version
        run: |
          RAW_VERSION=$(node -p "require('./extension/package.json').version")
          RELEASE_TAG="extension-v${RAW_VERSION}"
          echo "version=${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

      - name: Build Chrome and Firefox packages
        working-directory: extension
        run: |
          npm run zip
          npm run zip:firefox

      - name: Publish release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Quick Fill Extension v${{ steps.version.outputs.version }}"
          body: |
            ## Job Cruiser Quick Fill v${{ steps.version.outputs.version }}

            Automated build for commit `${{ github.sha }}`.

            ### Installation Instructions

            #### Brave / Chrome / Chromium Browsers
            1. Download `jobcruiser-quickfill-${{ steps.version.outputs.version }}-chrome.zip` below.
            2. Extract the zip archive to a folder on your computer.
            3. Open `chrome://extensions` or `brave://extensions` and enable **Developer mode** in the top right.
            4. Click **Load unpacked** and select the extracted folder.

            #### Zen / Firefox Browsers
            - If published to Mozilla Add-ons, install directly from the AMO listing.
            - Otherwise, download `jobcruiser-quickfill-${{ steps.version.outputs.version }}-firefox.zip`.
          files: |
            extension/.output/*-chrome.zip
            extension/.output/*-firefox.zip
            extension/.output/*-sources.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Firefox Add-on Store (AMO)
        if: env.FIREFOX_JWT_ISSUER != '' && env.FIREFOX_JWT_SECRET != ''
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID || 'jobcruiser-quickfill@jobcruiser.app' }}
          FIREFOX_CHANNEL: ${{ vars.FIREFOX_CHANNEL || 'listed' }}
        working-directory: extension
        run: |
          FIREFOX_ZIP=$(ls .output/*-firefox.zip | head -n 1)
          SOURCES_ZIP=$(ls .output/*-sources.zip | head -n 1)
          npx wxt submit \
            --firefox-zip "$FIREFOX_ZIP" \
            --firefox-sources-zip "$SOURCES_ZIP" \
            --firefox-extension-id "$FIREFOX_EXTENSION_ID" \
            --firefox-jwt-issuer "$FIREFOX_JWT_ISSUER" \
            --firefox-jwt-secret "$FIREFOX_JWT_SECRET" \
            --firefox-channel "$FIREFOX_CHANNEL"
        continue-on-error: true
